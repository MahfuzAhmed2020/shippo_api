spring.application.name=shippo-api

server.port=8080

spring.config.import=optional:file:.env[.properties]

# Shippo API key comes from the SHIPPO_API_KEY environment variable.
shippo.api-key=${SHIPPO_API_KEY}

# MySQL connection settings come from environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/shippo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# Avoid leaking internal exception details through the default error endpoint.
server.error.include-message=never
server.error.include-stacktrace=never
